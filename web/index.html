<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeKan — Buat CV ATS-Friendly dengan AI</title>
    <meta
      name="description"
      content="ResumeKan membuat CV yang lolos ATS dalam hitungan menit. Isi data, biarkan AI menyusun ringkasan profesional, lalu unduh PDF siap kirim ke rekruter."
    />
    <link rel="canonical" href="https://resumekan-production.up.railway.app/" />
    <!-- Guard FOUC: default light, hanya dark jika user pernah pilih dark -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("resumekan-theme") === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
